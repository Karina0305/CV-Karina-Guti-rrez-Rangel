<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <meta name="description" content="PRUEBA tipográfica — sistema anterior Mi_Sistema_de_Diseno_Karina: Neue Haas Grotesk Display Pro + PerecScripte2/PeregroyJF (paleta fucsia/tinta/papel se mantiene).">
<title>Design System v4 — Karina Gutiérrez Rangel</title>

<style>
  /* ============================================================
     TOKENS — DESIGN_v4.md
     ============================================================ */
  :root{
    --primary:     #A31262; /* Fiusha oscuro — guía Sistema_Diseño_KGR */
    --secondary:   #2F5FD6; /* Azul */
    --verde:       #3E8E5A; /* Verde restaurado (se elimina naranja #E85D24) */
    --on-surface:  #111111; /* Tinta */
    --surface:     #FAF7F2; /* Papel 70-80% layout */
    --link:        #2F5FD6;
    --btn-sec:     #2F5FD6;
    --text-tert:   #8A8278;

    --pop-border: 3px solid #000;
    --pop-border-thin: 2px solid #000;
    --pop-shadow: 6px 6px 0 #000;
    --pop-shadow-sm: 4px 4px 0 #000;
    --pop-shadow-pink: 6px 6px 0 var(--primary);
    --pop-shadow-teal: 6px 6px 0 var(--secondary);
    --pop-shadow-beige: 6px 6px 0 var(--surface);

    --ease: cubic-bezier(.19,1,.22,1);
    --gutter: 24px;
    --section: clamp(80px, 11vw, 140px);
    --content-max: 1280px;
    --r-card: 0px;
    --r-pill: 999px;
    --r-kicker: 18px;
  }

  @font-face{ font-family:"Neue Haas Grotesk Display Pro"; src:url("assets/fonts/NeueHaasDisplayRoman.woff") format("woff"); font-weight:400; font-style:normal; font-display:swap; }
  @font-face{ font-family:"Neue Haas Grotesk Display Pro"; src:url("assets/fonts/NeueHaasDisplayMediu.woff") format("woff"); font-weight:500; font-style:normal; font-display:swap; }
  @font-face{ font-family:"Neue Haas Grotesk Display Pro"; src:url("assets/fonts/NeueHaasDisplayBold.woff") format("woff"); font-weight:700; font-style:normal; font-display:swap; }
  @font-face{ font-family:"PerecScripte2"; src:url("assets/fonts/PeregroyJF Regular.woff") format("woff"); font-weight:400; font-style:normal; font-display:swap; }
  @font-face{ font-family:"PeregroyJF"; src:url("assets/fonts/PeregroyJF Regular.woff") format("woff"); font-weight:400; font-style:normal; font-display:swap; }
  @font-face{ font-family:"Filson Soft"; src:url("assets/fonts/WOFF2/Filson-Soft-Regular.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:swap; }
  @font-face{ font-family:"Filson Soft"; src:url("assets/fonts/WOFF2/Filson-Soft-Medium.woff2") format("woff2"); font-weight:500; font-style:normal; font-display:swap; }
  @font-face{ font-family:"Filson Soft"; src:url("assets/fonts/WOFF2/Filson-Soft-Bold.woff2") format("woff2"); font-weight:700; font-style:normal; font-display:swap; }
  @font-face{ font-family:"Filson Soft"; src:url("assets/fonts/WOFF2/Filson-Soft-Book.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:swap; }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:"Neue Haas Grotesk Display Pro","Filson Soft","Segoe UI",system-ui,sans-serif;
    font-size:16px; line-height:1.6; font-weight:400;
    color:#fff; background:var(--primary);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{ display:block; max-width:100%; }
  :focus-visible{ outline:3px solid var(--secondary); outline-offset:3px; }
  ::selection{ background:var(--primary); color:#fff; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

  /* ============================================================
     GRAIN OVERLAY
     ============================================================ */
  body::after{
    content:""; position:fixed; inset:0; z-index:999; pointer-events:none;
    opacity:.04; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:128px 128px;
  }

  /* REST OF CSS CONTINUES... */
</style>
</head>
